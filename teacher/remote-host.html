<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeHistorical | iPad Remote Host</title>
<style>
:root{--bg:#17191a;--panel:#24282a;--line:#5a5f5c;--gold:#c9a46a;--paper:#f5f0e7;--ok:#75b777;--warn:#d6a95e;font-family:Montserrat,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--paper);overflow:hidden}.bar{height:58px;display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:2px solid var(--gold)}.brand{font-weight:900;color:var(--gold);white-space:nowrap}.status{font-size:.78rem}.code{font-weight:900;letter-spacing:.18em;background:#0f1112;border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:#fff}.spacer{flex:1}.btn{border:1px solid var(--line);border-radius:8px;background:#3e4447;color:#fff;padding:8px 11px;font-weight:800;cursor:pointer}.btn:hover{background:#555d60}.btn.gold{background:var(--gold);color:#151718;border-color:var(--gold)}.connected{color:var(--ok);font-weight:800}.waiting{color:var(--warn);font-weight:800}iframe{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#202426}.qr-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.68);padding:24px}.qr-backdrop.hidden{display:none}.qr-card{width:min(440px,94vw);background:var(--paper);color:#151718;border-radius:18px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.45);text-align:center}.qr-card h2{margin:.1rem 0 .35rem;font-size:1.45rem}.qr-card p{margin:.35rem auto 1rem;max-width:340px;line-height:1.45;color:#444}.qr-code{display:inline-grid;place-items:center;min-width:244px;min-height:244px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:12px;margin:8px auto 14px}.qr-code img,.qr-code canvas{display:block}.qr-pair{font-size:.78rem;color:#666}.qr-pair strong{display:block;margin-top:3px;font-size:1.2rem;letter-spacing:.16em;color:#151718}.qr-actions{display:flex;justify-content:center;gap:8px;margin-top:16px}.qr-actions .btn{font-size:.78rem}.qr-close{background:#fff;color:#151718;border-color:#aaa}@media(max-width:780px){.status{display:none}.brand{font-size:.85rem}.bar{gap:7px;padding:7px 8px}.code{font-size:.82rem}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">BeHistorical · iPad Remote</div>
  <div class="status">Session</div>
  <div class="code" id="code">------</div>
  <div id="connection" class="waiting">Starting secure relay…</div>
  <div class="spacer"></div>
  <button class="btn" id="openProjection">Open Projection</button>
  <button class="btn gold" id="showQr">Scan iPad QR</button>
  <button class="btn" id="copyLink">Copy iPad Link</button>
</div>
<iframe id="command" title="Teacher Command Center"></iframe>
<div class="qr-backdrop hidden" id="qrBackdrop" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="qr-card">
    <h2 id="qrTitle">Connect Your iPad</h2>
    <p>Scan this with the iPad Camera. Safari opens the correct lesson and joins this remote session automatically.</p>
    <div class="qr-code" id="qrCode" aria-label="iPad remote QR code"></div>
    <div class="qr-pair">Session label<strong id="qrPairCode">------</strong></div>
    <div class="qr-actions">
      <button class="btn qr-close" id="closeQr">Close</button>
      <button class="btn" id="copyQrLink">Copy Link</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search);
const topic=(params.get('topic')||'2-2').replace(/[^0-9-]/g,'');
const frame=document.getElementById('command');
const codeEl=document.getElementById('code');
const connEl=document.getElementById('connection');
const qrBackdrop=document.getElementById('qrBackdrop');
const qrCode=document.getElementById('qrCode');
const qrPairCode=document.getElementById('qrPairCode');
frame.src=(topic==='2-2'||topic==='2-1'||topic==='2-3')?'topic-'+topic+'-os.html':'command-center-topic-'+topic+'.html';
let ipadUrl='',source=null,lastRemoteIndex=-1;
function makeToken(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}
const session=makeToken();
const label=session.slice(0,6).toUpperCase();
const relayTopic='behistorical-remote-'+session;
const relayUrl='https://ntfy.sh/'+relayTopic;
codeEl.textContent=label;
function buildIpadUrl(){const url=new URL('ipad-remote.html',location.href);url.searchParams.set('topic',topic);url.searchParams.set('session',session);return url.href;}
function renderQr(){ipadUrl=buildIpadUrl();qrPairCode.textContent=label;qrCode.innerHTML='';if(window.QRCode){new QRCode(qrCode,{text:ipadUrl,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}else{qrCode.textContent='QR code unavailable. Use Copy Link instead.';}qrBackdrop.classList.remove('hidden');}
function frameDoc(){try{return frame.contentDocument||frame.contentWindow.document;}catch(e){return null;}}
function click(sel){const d=frameDoc(),el=d&&d.querySelector(sel);if(el){el.click();return true;}return false;}
function readIndex(){const d=frameDoc(),c=d&&d.querySelector('#count');if(!c)return 0;const m=(c.textContent||'').match(/(\d+)\s*\//);return m?Math.max(0,Number(m[1])-1):0;}
function readState(){const d=frameDoc();if(!d)return null;const count=d.querySelector('#count'),title=d.querySelector('#appTitle,#headerTitle,#noteTitle');return{type:'state',index:readIndex(),count:count?count.textContent:'',title:title?title.textContent:'',sender:'host',ts:Date.now()};}
async function publish(payload){try{await fetch(relayUrl,{method:'POST',body:JSON.stringify(Object.assign({sender:'host',ts:Date.now()},payload))});return true;}catch(e){connEl.textContent='Relay send failed — check internet';connEl.className='waiting';return false;}}
function sendState(){const state=readState();if(state)publish(state);}
function gotoIndex(target){target=Math.max(0,Number(target)||0);const current=readIndex(),delta=target-current;if(!delta)return;const key=delta>0?'ArrowRight':'ArrowLeft';for(let i=0;i<Math.abs(delta);i++){frame.contentWindow.document.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));}}
function handle(data){if(!data||data.sender!=='ipad')return;connEl.textContent='iPad connected';connEl.className='connected';qrBackdrop.classList.add('hidden');switch(data.type){case'hello':sendState();return;case'next':click('#next');break;case'prev':click('#prev');break;case'start':click('#start');break;case'goto':gotoIndex(data.index);break;case'timer-toggle':click('#toggleTimer');break;case'timer-reset':click('#resetTimer');break;}setTimeout(sendState,100);}
function parseRelayEvent(event){try{const outer=JSON.parse(event.data);if(outer.event!=='message'||!outer.message)return;handle(JSON.parse(outer.message));}catch(e){}}
function startRelay(){source=new EventSource(relayUrl+'/sse');source.onopen=()=>{connEl.textContent='Waiting for iPad';connEl.className='waiting';renderQr();};source.onmessage=parseRelayEvent;source.onerror=()=>{connEl.textContent='Relay reconnecting…';connEl.className='waiting';};}
frame.addEventListener('load',()=>{lastRemoteIndex=readIndex();setInterval(()=>{const i=readIndex();if(i!==lastRemoteIndex){lastRemoteIndex=i;if(connEl.classList.contains('connected'))sendState();}},1000);});
document.getElementById('openProjection').addEventListener('click',()=>click('#openProjection'));
document.getElementById('showQr').addEventListener('click',renderQr);
document.getElementById('closeQr').addEventListener('click',()=>qrBackdrop.classList.add('hidden'));
qrBackdrop.addEventListener('click',e=>{if(e.target===qrBackdrop)qrBackdrop.classList.add('hidden');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')qrBackdrop.classList.add('hidden');});
async function copyIpadLink(button){const url=ipadUrl||buildIpadUrl();try{await navigator.clipboard.writeText(url);const old=button.textContent;button.textContent='Copied';setTimeout(()=>button.textContent=old,1200);}catch(e){prompt('Open this on the iPad:',url);}}
document.getElementById('copyLink').addEventListener('click',e=>copyIpadLink(e.currentTarget));
document.getElementById('copyQrLink').addEventListener('click',e=>copyIpadLink(e.currentTarget));
startRelay();
})();
</script>
</body>
</html>
