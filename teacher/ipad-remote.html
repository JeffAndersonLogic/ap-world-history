<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BeHistorical | iPad Teacher Remote</title>
<style>
:root{--bg:#151718;--panel:#24282a;--line:#5a5f5c;--gold:#c9a46a;--paper:#f5f0e7;--ok:#75b777;--warn:#d6a95e;font-family:Montserrat,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--paper);overflow:hidden}.shell{display:grid;grid-template-rows:auto 1fr;height:100dvh}.bar{display:flex;align-items:center;gap:9px;padding:9px max(10px,env(safe-area-inset-right)) 9px max(10px,env(safe-area-inset-left));background:var(--panel);border-bottom:6px solid #151718;box-shadow:inset 0 -2px 0 var(--gold);position:relative;z-index:10}.brand{font-weight:900;color:var(--gold);white-space:nowrap}.btn{border:1px solid var(--line);border-radius:8px;background:#3e4447;color:#fff;padding:9px 11px;font-weight:800}.btn:hover{background:#555d60}.btn.slide-next{background:#111516;border-color:#747c7f;color:var(--paper);min-width:104px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}.btn.slide-next:hover{border-color:var(--paper);background:#1d2325}.btn.exit-present{display:none;background:var(--gold);color:#151718;border-color:var(--gold);min-width:132px}.btn.exit-present.show{display:inline-block}.status{font-size:.78rem;font-weight:800;color:var(--warn)}.status.ok{color:var(--ok)}.spacer{flex:1}.controls{display:flex;align-items:center;gap:7px;margin-right:clamp(72px,12vw,180px);padding:4px 6px;border:1px solid #3f474a;border-radius:10px;background:#1a1f21}.control-label{font-size:.6rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#9ea7a9;margin-right:2px}.content{position:relative;min-height:0}.content iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#202426}.offline{position:absolute;inset:0;display:grid;place-items:center;background:#17191a;padding:25px;text-align:center;z-index:3}.offline.hidden{display:none}.offline h1{color:var(--gold);margin:.1rem 0 .7rem}.offline p{max-width:560px;line-height:1.5;color:#ddd5c8}.slidebadge{position:fixed;right:12px;bottom:12px;z-index:5;background:rgba(15,17,18,.9);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-weight:800;font-size:.72rem;color:var(--gold);pointer-events:none}@media(max-width:840px){.brand{font-size:.8rem}.bar{flex-wrap:wrap}.status{order:5;width:100%}.spacer{display:none}.controls{margin-left:auto;margin-right:0}.control-label{display:none}.btn{padding:8px 9px}.btn.slide-next{min-width:94px}.btn.exit-present{min-width:112px}}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <div class="brand">BeHistorical · Teacher Remote</div>
    <div id="status" class="status">Opening classroom relay…</div>
    <div class="spacer"></div>
    <div class="controls"><span class="control-label">Slide controls</span><button class="btn" id="back" aria-label="Previous slide">←</button><button class="btn slide-next" id="next">Next Slide →</button><button class="btn exit-present" id="exitPresent">Exit Present</button></div>
  </div>
  <div class="content">
    <div id="offline" class="offline"><div><h1>Your iPad is the Teacher Command Center</h1><p id="offlineText">Connecting to the classroom laptop…</p></div></div>
    <iframe id="command" title="Teacher Command Center"></iframe>
  </div>
</div>
<div id="slidebadge" class="slidebadge"></div>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search);
const topic=(params.get('topic')||'2-2').replace(/[^0-9-]/g,'');
const session=(params.get('session')||'').replace(/[^a-f0-9]/gi,'');
const frame=document.getElementById('command');
const status=document.getElementById('status');
const offline=document.getElementById('offline');
const offlineText=document.getElementById('offlineText');
const badge=document.getElementById('slidebadge');
const exitPresent=document.getElementById('exitPresent');
frame.src=(topic==='2-2'||topic==='2-1')?'topic-'+topic+'-os.html':'command-center-topic-'+topic+'.html';
let source=null,suppress=false,lastHostIndex=0,relayReady=false;
function setStatus(text,ok){status.textContent=text;status.className='status'+(ok?' ok':'');}
function setOffline(text){if(text)offlineText.textContent=text;offline.classList.remove('hidden');}
function frameDoc(){try{return frame.contentDocument||frame.contentWindow.document;}catch(e){return null;}}
function readIndex(){const d=frameDoc(),c=d&&d.querySelector('#count');if(!c)return 0;const m=(c.textContent||'').match(/(\d+)\s*\//);return m?Math.max(0,Number(m[1])-1):0;}
function localGoto(target){target=Math.max(0,Number(target)||0);const d=frameDoc();if(!d)return;const current=readIndex(),delta=target-current;if(!delta)return;suppress=true;const key=delta>0?'ArrowRight':'ArrowLeft';for(let i=0;i<Math.abs(delta);i++)d.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));setTimeout(()=>suppress=false,120);}
function setPresentMode(on){const d=frameDoc();if(!d)return;d.body.classList.toggle('project-mode',!!on);exitPresent.classList.toggle('show',!!on);badge.style.display=on?'none':'';}
if(session.length<20){setStatus('Scan the QR code on the laptop',false);setOffline('This page needs a live classroom session. Open the remote host on the laptop and scan its QR code with the iPad Camera.');return;}
const relayTopic='behistorical-remote-'+session;
const relayUrl='https://ntfy.sh/'+relayTopic;
async function publish(type,extra){const payload=Object.assign({type,sender:'ipad',ts:Date.now()},extra||{});try{const r=await fetch(relayUrl,{method:'POST',body:JSON.stringify(payload)});if(!r.ok)throw new Error('HTTP '+r.status);return true;}catch(e){setStatus('Relay send failed — check internet',false);setOffline('The iPad could not send a command through the web relay. Check that Safari has internet access, then rescan the laptop QR code.');return false;}}
function bindFrame(){const d=frameDoc();if(!d)return;d.addEventListener('click',e=>{if(suppress)return;const present=e.target.closest&&e.target.closest('#presentHere');if(present){e.preventDefault();e.stopImmediatePropagation();setPresentMode(true);return;}const target=e.target.closest&&e.target.closest('#next,#prev,#start,#toggleTimer,#resetTimer,.flow-card');if(!target)return;if(target.id==='next')publish('next');else if(target.id==='prev')publish('prev');else if(target.id==='start')publish('start');else if(target.id==='toggleTimer')publish('timer-toggle');else if(target.id==='resetTimer')publish('timer-reset');else if(target.classList.contains('flow-card'))publish('goto',{index:Number(target.dataset.slide)||0});},true);d.addEventListener('keydown',e=>{if(suppress)return;if(e.key==='ArrowRight'||e.key==='PageDown')publish('next');else if(e.key==='ArrowLeft'||e.key==='PageUp')publish('prev');else if(e.key==='Home')publish('start');else if(e.key==='Escape')setPresentMode(false);},true);}
frame.addEventListener('load',()=>{setPresentMode(false);bindFrame();});
function handle(data){if(!data||data.sender!=='host'||data.type!=='state')return;lastHostIndex=Number(data.index)||0;localGoto(lastHostIndex);badge.textContent=data.count||'';offline.classList.add('hidden');setStatus('Connected to classroom laptop',true);}
function parseRelayEvent(event){try{const outer=JSON.parse(event.data);if(outer.event!=='message'||!outer.message)return;handle(JSON.parse(outer.message));}catch(e){}}
function startRelay(){source=new EventSource(relayUrl+'/sse');source.onopen=()=>{relayReady=true;setStatus('Relay connected — finding laptop…',false);publish('hello');};source.onmessage=parseRelayEvent;source.onerror=()=>{relayReady=false;setStatus('Relay reconnecting…',false);setOffline('The web relay is reconnecting. Keep this page open; it should recover automatically.');};}
document.getElementById('next').addEventListener('click',()=>{publish('next');localGoto(lastHostIndex+1);});
document.getElementById('back').addEventListener('click',()=>{publish('prev');localGoto(Math.max(0,lastHostIndex-1));});
exitPresent.addEventListener('click',()=>setPresentMode(false));
startRelay();
})();
</script>
</body>
</html>
