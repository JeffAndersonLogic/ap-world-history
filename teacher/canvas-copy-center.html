<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeHistorical Canvas Copy Center</title><style>:root{--s:#1a1c1d;--p:#f5f0e7;--w:#fffdf7;--i:#151718;--g:#c9a46a;--r:#6b3e1f;--ok:#2f5c46;--b:#ddd2be}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Montserrat,Arial,sans-serif}header{background:var(--s);color:#fff;border-top:5px solid var(--g);padding:22px 28px}h1{margin:0;font:700 25px Georgia,serif}main{width:min(1180px,calc(100% - 28px));margin:22px auto 60px}.panel,.card{background:var(--w);border:1px solid var(--b);box-shadow:0 2px 10px #0001}.panel{padding:15px;margin-bottom:16px;border-left:5px solid var(--r)}.controls{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:10px;align-items:end}label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}select,input{width:100%;padding:10px;border:1px solid #bfb6a8;background:#fff}button{border:0;border-radius:4px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--r);color:#fff}.copy{background:var(--ok);color:#fff}.ghost{background:#eee7db;color:var(--i);border:1px solid #d4c7b4}.grid{display:grid;gap:14px}.card{border-top:4px solid var(--g);padding:16px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.head h2{margin:0;font:700 20px Georgia,serif}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:11px;font-weight:700;background:#efe7da;padding:4px 8px;border-radius:999px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:12px;margin:8px 0 16px;color:#5f5a52}.status.ok{color:var(--ok)}details{margin-top:12px;border-top:1px solid var(--b);padding-top:10px}summary{cursor:pointer;font-weight:700;color:var(--r)}pre{white-space:pre-wrap;word-break:break-word;background:#111314;color:#f5f0e7;padding:13px;max-height:360px;overflow:auto;font-size:12px}.empty{padding:30px;text-align:center;background:#fff;border:1px solid var(--b)}#toast{position:fixed;right:18px;bottom:18px;background:var(--s);color:#fff;border-left:4px solid var(--g);padding:12px 15px;opacity:0;transform:translateY(10px);transition:.15s;z-index:50}#toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:100}.dialog{width:min(900px,96vw);background:var(--w);border-top:5px solid var(--g);padding:18px}.dialog h2{margin-top:0;font-family:Georgia,serif}.dialog textarea{width:100%;height:320px;font:12px/1.45 ui-monospace,Consolas,monospace}.row{display:flex;gap:8px;margin-top:10px}@media(max-width:760px){.controls{grid-template-columns:1fr}.head{flex-direction:column}}</style></head><body><header><h1>BeHistorical Canvas Copy Center</h1></header><main><section class="panel"><strong>Assignments + Calendar Events, live from main.</strong> Click <strong>Copy HTML</strong>, then paste into Canvas using the <strong>&lt;/&gt; HTML editor</strong>.</section><section class="panel controls"><div><label>Show</label><select id="scope"><option value="unit2">Unit 2</option><option value="unit1">Unit 1</option><option value="foundations">Foundations</option><option value="assessments">Assessments</option><option value="all">Everything</option></select></div><div><label>Type</label><select id="kind"><option value="assignment">Assignments</option><option value="event">Calendar Events</option></select></div><div><label>Search</label><input id="search" placeholder="2.1, Silk Roads, Mongol..."></div><div><button id="refresh" class="primary">Refresh</button></div></section><div id="status" class="status">Loading...</div><div id="grid" class="grid"></div></main><div id="toast">Copied</div><script>(()=>{const paths={assignment:'../docs/canvas/assignments.md',event:'../docs/canvas/calendar-events.md'},state={assignment:[],event:[]},grid=document.getElementById('grid'),status=document.getElementById('status'),scope=document.getElementById('scope'),kind=document.getElementById('kind'),search=document.getElementById('search'),toast=document.getElementById('toast');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function group(topic,heading){if(/^F\d+$/.test(topic))return'foundations';if(/^1\./.test(topic))return'unit1';if(/^2\./.test(topic))return'unit2';if(/assessment|quiz|exam/i.test(heading))return'assessments';return'other'}function parse(md,type){const re=/^##\s+(.+)$/gm,m=[...md.matchAll(re)],out=[];for(let i=0;i<m.length;i++){const heading=m[i][1].trim(),block=md.slice(m[i].index,i+1<m.length?m[i+1].index:md.length),code=(block.match(/```html\s*\n([\s\S]*?)\n```/)||[])[1];if(!code)continue;const tm=heading.match(/^Topic\s+([F0-9.]+):\s*(.+)$/),topic=tm?tm[1]:'',eventTitle=(block.match(/\*\*Event title:\*\*\s*`([^`]+)`/)||[])[1]||'',required=(block.match(/\*\*Required:\*\*\s*([^\n]+)/)||[])[1]||'';out.push({heading,topic,eventTitle,required,group:group(topic,heading),html:code.trim(),type})}return out}async function load(){status.className='status';status.textContent='Loading current Canvas source...';try{const[a,e]=await Promise.all([fetch(paths.assignment,{cache:'no-store'}),fetch(paths.event,{cache:'no-store'})]);if(!a.ok||!e.ok)throw Error('source file could not be loaded');state.assignment=parse(await a.text(),'assignment');state.event=parse(await e.text(),'event');status.className='status ok';status.textContent=`Loaded · ${state.assignment.length} assignments · ${state.event.length} events`;render()}catch(err){status.textContent='Could not load Canvas source: '+err.message;grid.innerHTML='<div class="empty">Reload and try again.</div>'}}function list(){const q=search.value.trim().toLowerCase();return state[kind.value].filter(x=>(scope.value==='all'||x.group===scope.value)&&(!q||(`${x.heading} ${x.topic} ${x.eventTitle} ${x.required}`).toLowerCase().includes(q)))}function toastMsg(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove('show'),1600)}function legacy(text){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}function manual(text){const w=document.createElement('div');w.className='modal';w.innerHTML='<div class="dialog"><h2>Clipboard permission is blocked</h2><p>The HTML is already selected. Press <strong>Ctrl+C</strong> (Windows) or <strong>Command+C</strong> (Mac).</p><textarea spellcheck="false"></textarea><div class="row"><button class="primary retry">Try Copy Again</button><button class="ghost close">Close</button></div></div>';document.body.appendChild(w);const ta=w.querySelector('textarea');ta.value=text;ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);w.querySelector('.close').onclick=()=>w.remove();w.querySelector('.retry').onclick=()=>{if(legacy(text)){w.remove();toastMsg('HTML copied to clipboard')}else{ta.focus();ta.select();toastMsg('Press Ctrl+C / Command+C')}}}async function copyText(text,btn){const old=btn.textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);btn.textContent='Copied ✓';toastMsg('HTML copied to clipboard');setTimeout(()=>btn.textContent=old,1300);return}}catch(e){}if(legacy(text)){btn.textContent='Copied ✓';toastMsg('HTML copied to clipboard');setTimeout(()=>btn.textContent=old,1300);return}manual(text)}function render(){const items=list();if(!items.length){grid.innerHTML='<div class="empty">No matching items.</div>';return}grid.innerHTML=items.map((x,i)=>`<article class="card"><div class="head"><div><h2>${esc(x.heading)}</h2><div class="chips">${x.topic?`<span class="chip">${esc(x.topic)}</span>`:''}${x.required?`<span class="chip">${esc(x.required)}</span>`:''}</div></div><div class="actions">${x.eventTitle?`<button class="ghost title" data-i="${i}">Copy event title</button>`:''}<button class="copy html" data-i="${i}">Copy HTML</button></div></div><details><summary>Show code</summary><pre>${esc(x.html)}</pre></details></article>`).join('');grid.querySelectorAll('.html').forEach(b=>b.onclick=()=>copyText(items[+b.dataset.i].html,b));grid.querySelectorAll('.title').forEach(b=>b.onclick=()=>copyText(items[+b.dataset.i].eventTitle,b))}document.getElementById('refresh').onclick=load;scope.onchange=render;kind.onchange=render;search.oninput=render;load()})();</script></body></html>
