<style>
:root{--night:#07090a;--panel:#171c1e;--line:#364044;--gold:#c9a46a;--bronze:#8c5a2b;--sand:#d2b48c;--paper:#f5f0e7;--muted:#aeb6b8;--green:#7fa879;--blue:#7b9bad;--red:#ad655e;--title:'Cinzel',Georgia,serif;--body:'Libre Baskerville',Georgia,serif;--ui:'Montserrat',system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body)}button,a{font-family:var(--ui)}.appbar{height:64px;position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:0 16px;background:rgba(7,9,10,.95);border-bottom:1px solid rgba(201,164,106,.3)}.brand{font:800 .83rem var(--title);letter-spacing:.12em;color:var(--gold);white-space:nowrap}.brand span{color:var(--paper)}.lesson-id{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:12px}.lesson-id .kicker{font:800 .57rem var(--ui);letter-spacing:.17em;text-transform:uppercase;color:var(--sand)}.lesson-id h1{margin:2px 0 0;font:700 .92rem var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clock{font:800 .9rem var(--ui);color:var(--gold);font-variant-numeric:tabular-nums}.btn{border:1px solid var(--line);background:#161c1e;color:var(--paper);border-radius:9px;padding:9px 11px;font:800 .58rem var(--ui);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer}.btn.primary{background:var(--gold);border-color:var(--gold);color:#111516}.mission{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}.mission .label{font:900 .56rem var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}.mission .question{font:.88rem var(--body);color:#ddd6ca}.mission .focus{font:800 .58rem var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.cockpit{max-width:1860px;margin:0 auto;padding:14px 16px 18px;display:grid;grid-template-columns:240px minmax(0,1fr) 430px;gap:16px}.panel{background:linear-gradient(180deg,rgba(23,28,30,.94),rgba(12,15,16,.94));border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.44)}.timeline,.intel{border-radius:16px;overflow:hidden;position:sticky;top:90px;max-height:calc(100vh - 104px);display:flex;flex-direction:column}.panel-head,.intel-top{padding:13px 14px;border-bottom:1px solid var(--line);background:#111516}.panel-head .eyebrow,.intel .eyebrow{font:900 .55rem var(--ui);letter-spacing:.17em;text-transform:uppercase;color:var(--gold)}.panel-head h2,.intel-top h2{font:700 .98rem var(--title);margin:3px 0 0}.timeline-scroll,.intel-scroll{overflow:auto;padding:8px}.flow-card{width:100%;display:grid;grid-template-columns:32px 1fr;gap:8px;text-align:left;border:0;border-left:2px solid #2d3537;background:transparent;color:var(--paper);padding:9px 8px;margin:0}.flow-card.active{background:linear-gradient(90deg,rgba(201,164,106,.14),transparent);border-left-color:var(--gold)}.flow-card .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);font:800 .55rem var(--ui);color:var(--muted)}.flow-card.active .num{border-color:var(--gold);color:var(--gold)}.flow-card .range{font:800 .5rem var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}.flow-card .name{display:block;font:700 .68rem var(--ui);line-height:1.15;color:#ece8df}.theater{border-radius:18px;overflow:hidden;background:#020303;border:1px solid #2d3638;box-shadow:0 28px 80px rgba(0,0,0,.56)}.stagebar{height:48px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#111516;border-bottom:1px solid var(--line)}.stagebar .slide-label{margin-left:5px;font:800 .56rem var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--sand)}.stagebar .count{margin-left:auto;font:800 .59rem var(--ui);letter-spacing:.08em;color:var(--gold)}.stage{position:relative;aspect-ratio:16/9;background:#030404;overflow:hidden}.rail{display:flex;gap:5px;padding:9px;background:#0d1011;border-top:1px solid var(--line);overflow-x:auto}.rail button{height:6px;min-width:18px;flex:1;border:0;border-radius:99px;background:#31393b;padding:0}.rail button.active{background:var(--gold)}.cue{padding:12px 13px;margin:0 0 9px;border-left:2px solid var(--line);background:rgba(255,255,255,.025)}.cue b{display:block;margin-bottom:6px;font:900 .6rem var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.cue p,.cue li{margin:0;font-size:.86rem;line-height:1.52;color:#dedbd3}.cue ul{margin:0;padding-left:18px}.cue li+li{margin-top:5px}.cue.ask{border-color:var(--gold)}.cue.listen{border-color:var(--green)}.cue.ap{border-color:var(--blue)}.cue.avoid{border-color:var(--red)}.transport{display:flex;gap:8px;margin-top:10px}.transport .btn{flex:1;text-align:center}.shortcuts{margin-top:7px;text-align:center;font:700 .53rem var(--ui);letter-spacing:.05em;color:#6f797c}.slide{width:100%;height:100%;background:#050708;color:var(--paper);overflow:hidden;position:relative}.slide::after{content:'';position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.35}.slide-kicker{font:900 clamp(.54rem,.8vw,.74rem) var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}.slide h2{font:700 clamp(2rem,4.4vw,5.1rem) var(--title);line-height:.98;letter-spacing:-.025em;margin:.35rem 0 0;text-wrap:balance}.slide .sub{font:400 clamp(.92rem,1.55vw,1.55rem) var(--body);line-height:1.38;color:#e1d7c8;max-width:58rem}.museum-head{padding:3.2% 4.4% 2.1%;background:linear-gradient(180deg,#101415,#090c0d);border-bottom:1px solid #2d3638}.museum-head h2{font-size:clamp(1.7rem,3.25vw,3.6rem)}.museum-foot{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1.25% 4.4%;background:#0d1112;border-top:1px solid #2d3638}.museum-foot .takeaway{font:800 clamp(.55rem,.7vw,.72rem) var(--ui);letter-spacing:.11em;text-transform:uppercase;color:var(--sand)}.hero-slide .media{position:absolute;inset:0}.hero-slide img{width:100%;height:100%;object-fit:cover}.hero-slide .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,6,.94) 0%,rgba(3,5,6,.78) 35%,rgba(3,5,6,.26) 68%,rgba(3,5,6,.14) 100%),linear-gradient(0deg,rgba(3,5,6,.84),transparent 37%)}.hero-slide .copy{position:absolute;z-index:2;left:5.2%;bottom:12%;width:min(69%,980px)}.image-slide,.grid-slide,.process-slide{display:grid;grid-template-rows:auto minmax(0,1fr) auto}.image-canvas{display:grid;place-items:center;min-height:0;padding:1.3% 2.2%;background:radial-gradient(circle at 50% 48%,#151a1c 0,#070909 62%)}.image-canvas img{width:100%;height:100%;object-fit:contain}.question-slide,.action-slide{display:grid;place-items:center;text-align:center;padding:7% 9%;background:radial-gradient(circle at 50% 40%,rgba(201,164,106,.1),transparent 38%),#060808}.question-slide .inner,.action-slide .inner{max-width:1100px}.action-slide .big-number{font:800 clamp(5rem,12vw,11rem) var(--title);line-height:.8;color:rgba(201,164,106,.15);position:absolute;right:5%;top:8%}.action-line{width:80px;height:2px;background:var(--gold);margin:1.7rem auto}.grid-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:4%;align-items:stretch}.grid-card{border:1px solid var(--line);background:#0e1213;padding:1.7rem;display:flex;flex-direction:column;justify-content:center;text-align:center}.grid-card h3{font:900 clamp(.8rem,1.05vw,1.1rem) var(--ui);letter-spacing:.1em;color:var(--gold);margin:0 0 .8rem}.grid-card p{font-size:clamp(1rem,1.35vw,1.45rem);line-height:1.35;margin:0}.process-track{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:0;padding:4% 4.5%;position:relative}.process-track::before{content:'';position:absolute;left:9%;right:9%;top:50%;height:2px;background:linear-gradient(90deg,var(--bronze),var(--gold),var(--blue));opacity:.7}.process-node{position:relative;z-index:2;text-align:center;padding:0 1vw}.process-node .circle{width:clamp(48px,5.5vw,78px);height:clamp(48px,5.5vw,78px);margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;background:#0a0d0e;border:2px solid var(--gold);font:900 .8rem var(--ui);color:var(--gold)}.process-node h3{font:900 clamp(.62rem,.78vw,.82rem) var(--ui);letter-spacing:.13em;text-transform:uppercase;color:var(--gold);margin:0 0 .55rem}.process-node p{font:400 clamp(.78rem,1.05vw,1.08rem) var(--body);line-height:1.35;margin:0;color:#e2d9cb}.project-mode{overflow:hidden}.project-mode .appbar,.project-mode .mission,.project-mode .timeline,.project-mode .intel,.project-mode .rail,.project-mode .stagebar,.project-mode .transport,.project-mode .shortcuts{display:none!important}.project-mode .cockpit{display:block;max-width:none;padding:0}.project-mode .theater{border:0;border-radius:0;box-shadow:none}.project-mode .stage{width:100vw;height:100vh;aspect-ratio:auto}
@media(max-width:1050px){.cockpit{grid-template-columns:1fr}.timeline,.intel{position:static;max-height:none}.mission{grid-template-columns:1fr}.mission .label,.mission .focus{display:none}.stage{min-height:52vw}}
</style>

<body>
<header class="appbar"><div class="brand">Be<span>Historical</span></div><div class="lesson-id"><div class="kicker">Teaching OS · Topic 2.6</div><h1 id="appTitle">Environmental Consequences of Connectivity</h1></div><div class="clock" id="timer">00:00</div><button class="btn" id="toggleTimer">Start Timer</button><button class="btn" id="briefingBtn">Briefing</button><button class="btn" id="openProjection">Projection</button><button class="btn primary" id="presentHere">Present</button></header>
<div class="mission"><div class="label">Essential question</div><div class="question" id="essential"></div><div class="focus" id="apFocus"></div></div>
<main class="cockpit"><aside class="timeline panel"><div class="panel-head"><div class="eyebrow">Run of show</div><h2>90-minute arc</h2></div><div class="timeline-scroll" id="flow"></div></aside><section class="theater-wrap"><div class="theater"><div class="stagebar"><button class="btn" id="prev">←</button><button class="btn" id="next">→</button><button class="btn" id="start">Start</button><span class="slide-label" id="slideLabel"></span><span class="count" id="count"></span></div><div class="stage" id="stage"></div><div class="rail" id="rail"></div></div><div class="transport"><button class="btn" id="resetTimer">Reset Timer</button><a class="btn" href="remote-host.html?topic=2-6" target="_blank">iPad Remote</a><a class="btn" href="../unit-2/lesson-2-6-environmental-consequences.html" target="_blank">Student Lesson</a></div><div class="shortcuts">← → navigate · P projection · F present · B briefing · Esc exits</div></section><aside class="intel panel"><div class="intel-top"><div class="eyebrow">Teacher Intelligence</div><div class="phase" id="intelPhase"></div><h2 id="intelTitle"></h2></div><div class="intel-scroll" id="intel"></div></aside></main>
<script src="data/topic-2-6-teaching.js?v=story-os-1"></script>
<script>
(function(){'use strict';
const T=window.BEHISTORICAL_TEACHING;if(!T)return;let i=0,seconds=0,ticking=null;const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(new URLSearchParams(location.search).get('mode')==='project')document.body.classList.add('project-mode');
$('essential').textContent=T.meta.essentialQuestion;$('apFocus').textContent=T.meta.apFocus;$('appTitle').textContent=T.meta.title;
function img(v){return v&&v.url?`<img src="${esc(v.url)}" alt="${esc(v.alt||'Historical visual')}">`:''}function head(s){return`<header class="museum-head"><div class="slide-kicker">${esc(s.eyebrow||s.phase||'Topic 2.6')}</div><h2>${esc(s.title||'')}</h2>${s.subtitle?`<div class="sub">${esc(s.subtitle)}</div>`:''}</header>`}function foot(s){return`<footer class="museum-foot"><span class="takeaway">${esc(s.footer||'')}</span></footer>`}
function hero(s){return`<section class="slide hero-slide ${esc(s.position||'')}"><div class="media">${img(s.visual)}</div><div class="veil"></div><div class="copy"><div class="slide-kicker">${esc(s.eyebrow||'')}</div><h2>${esc(s.title||'')}</h2>${s.subtitle?`<div class="sub">${esc(s.subtitle)}</div>`:''}</div></section>`}
function image(s){return`<section class="slide image-slide">${head(s)}<div class="image-canvas">${img(s.visual)}</div>${foot(s)}</section>`}
function question(s){return`<section class="slide question-slide"><div class="inner"><div class="slide-kicker">${esc(s.eyebrow||'')}</div><h2>${esc(s.title||'')}</h2>${s.subtitle?`<div class="sub">${esc(s.subtitle)}</div>`:''}</div></section>`}
function action(s){return`<section class="slide action-slide"><div class="big-number">${esc(s.big||'')}</div><div class="inner"><div class="slide-kicker">${esc(s.eyebrow||'')}</div><h2>${esc(s.title||'')}</h2>${s.subtitle?`<div class="sub">${esc(s.subtitle)}</div>`:''}<div class="action-line"></div>${s.action?`<a class="btn primary" href="${esc(s.action.url)}" target="_blank">${esc(s.action.label||'Open')}</a>`:''}</div></section>`}
function grid(s){return`<section class="slide grid-slide">${head(s)}<div class="grid-cards">${(s.cards||[]).map(c=>`<article class="grid-card"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></article>`).join('')}</div>${foot(s)}</section>`}
function process(s){return`<section class="slide process-slide">${head(s)}<div class="process-track">${(s.steps||[]).map((x,n)=>`<div class="process-node"><div class="circle">${String(n+1).padStart(2,'0')}</div><h3>${esc(x.label)}</h3><p>${esc(x.text)}</p></div>`).join('')}</div>${foot(s)}</section>`}
function renderSlide(s){if(s.kind==='hero')return hero(s);if(s.kind==='image'||s.kind==='map')return image(s);if(s.kind==='grid')return grid(s);if(s.kind==='process')return process(s);if(s.kind==='action')return action(s);return question(s)}
function renderIntel(s){const n=s.notes||{};const cues=[];if(n.land)cues.push(['LAND',`<ul>${n.land.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`]);if(n.story)cues.push(['STORY',esc(n.story)]);if(n.ask)cues.push(['ASK',esc(n.ask),'ask']);if(n.listenFor)cues.push(['LISTEN FOR',esc(n.listenFor),'listen']);if(n.ap)cues.push(['AP CONNECTION',esc(n.ap),'ap']);if(n.avoid)cues.push(['AVOID',esc(n.avoid),'avoid']);$('intelPhase').textContent=s.phase||'';$('intelTitle').textContent=s.title||'';$('intel').innerHTML=cues.map(c=>`<div class="cue ${c[2]||''}"><b>${c[0]}</b><p>${c[1]}</p></div>`).join('')}
function render(){const s=T.slides[i];$('stage').innerHTML=renderSlide(s);$('slideLabel').textContent=s.eyebrow||s.phase||'';$('count').textContent=`${i+1} / ${T.slides.length}`;renderIntel(s);[...$('rail').children].forEach((b,n)=>b.classList.toggle('active',n===i));[...$('flow').children].forEach((b,n)=>b.classList.toggle('active',Number(b.dataset.slide)===i));localStorage.setItem(T.projection.storageKey,String(i))}
function go(n){i=Math.max(0,Math.min(T.slides.length-1,n));render()}function tick(){seconds++;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');$('timer').textContent=`${m}:${s}`}
T.slides.forEach((s,n)=>{const b=document.createElement('button');b.type='button';b.onclick=()=>go(n);$('rail').appendChild(b)});T.flow.forEach((f,n)=>{const b=document.createElement('button');b.className='flow-card';b.dataset.slide=String(Math.max(0,(f.slide||1)-1));b.innerHTML=`<span class="num">${String(n+1).padStart(2,'0')}</span><span><span class="range">${esc(f.range)}</span><span class="name">${esc(f.label)}</span></span>`;b.onclick=()=>go(Number(b.dataset.slide));$('flow').appendChild(b)});
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('start').onclick=()=>go(0);$('resetTimer').onclick=()=>{seconds=0;$('timer').textContent='00:00'};$('toggleTimer').onclick=()=>{if(ticking){clearInterval(ticking);ticking=null;$('toggleTimer').textContent='Start Timer'}else{ticking=setInterval(tick,1000);$('toggleTimer').textContent='Pause Timer'}};$('presentHere').onclick=()=>document.body.classList.toggle('project-mode');$('openProjection').onclick=()=>window.open(T.projection.file,'_blank');document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1);if(e.key.toLowerCase()==='f')document.body.classList.toggle('project-mode');if(e.key.toLowerCase()==='p')window.open(T.projection.file,'_blank');if(e.key==='Escape')document.body.classList.remove('project-mode')});render();
})();
</script>
