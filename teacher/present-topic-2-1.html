<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeHistorical | Topic 2.1 Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--steel:#1A1C1D;--charcoal:#2B2F31;--gunmetal:#3E4447;--sand:#D2B48C;--gold:#C9A46A;--paper:#F5F0E7;--ink:#151718;--title:'Cinzel',Georgia,serif;--body:'Libre Baskerville',Georgia,serif;--ui:'Montserrat',system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0f10;color:var(--paper);font-family:var(--body)}#stage{width:100vw;height:100vh}.slide{width:100%;height:100%;padding:7vh 6vw;display:flex;flex-direction:column;justify-content:center;position:relative;background:linear-gradient(135deg,#17191a,#282c2e);overflow:hidden}.slide-eyebrow{font:800 clamp(.75rem,1vw,1rem) var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:2vh}.slide h2{font:700 clamp(3rem,6.3vw,7rem)/1.02 var(--title);margin:0;max-width:92vw}.subtitle{font-size:clamp(1.3rem,2.1vw,2.4rem);max-width:80vw;margin-top:2.4vh;color:#ddd5c8;line-height:1.35}.footer{margin-top:2.5vh;font:700 clamp(.8rem,1.1vw,1.15rem) var(--ui);color:var(--sand);letter-spacing:.04em}.hero-slide.has-image,.image-slide{padding:0}.slide-visual{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:7vh 6vw;background:linear-gradient(transparent,rgba(0,0,0,.93) 38%)}.hero-copy h2{font-size:clamp(3.5rem,7vw,8rem)}.image-slide .slide-visual{object-fit:contain;background:#0e1011;padding:4vh 4vw}.image-copy{position:absolute;left:3vw;top:3vh;max-width:72vw;padding:2vh 2vw;background:rgba(14,16,17,.9);border-left:6px solid var(--gold)}.image-copy h2{font-size:clamp(2rem,3.6vw,4.2rem)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;margin-top:4vh}.step{border:1px solid #5a5f61;border-radius:14px;padding:2.8vh 1.8vw;background:rgba(255,255,255,.045)}.step b{display:block;color:var(--gold);font:800 clamp(.75rem,1vw,1.05rem) var(--ui);letter-spacing:.1em;margin-bottom:1vh}.step span{font-size:clamp(1.1rem,1.65vw,1.8rem);line-height:1.35}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.6vw;margin-top:3.5vh}.grid-item{border:1px solid #5a5f61;border-radius:14px;padding:2.4vh 1.8vw;background:rgba(255,255,255,.045)}.grid-item h3{font:700 clamp(1.2rem,1.8vw,2rem) var(--title);color:var(--gold);margin:0 0 .6vh}.grid-item p{margin:0;font-size:clamp(1rem,1.45vw,1.55rem)}.video-wrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.45fr);gap:2.3vw;align-items:center}.video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;box-shadow:0 10px 35px rgba(0,0,0,.45)}.video-copy h2{font-size:clamp(2.3rem,4.4vw,5rem)}.action-link{display:none}.hint{position:fixed;right:1vw;bottom:1vh;font:600 .65rem var(--ui);color:rgba(255,255,255,.32);z-index:5}@media(max-width:900px){.video-wrap,.grid,.steps{grid-template-columns:1fr}.slide h2{font-size:clamp(2.5rem,7vw,5rem)}}
</style></head><body><div id="stage"></div><div class="hint">← → navigate · F fullscreen</div>
<script src="../assets/data/lesson-2-1-silk-roads.js?v=response-id-fix-v1"></script><script src="../assets/data/lesson-2-1-renderer-config.js?v=response-id-fix-v1"></script><script src="data/topic-2-1-teaching.js"></script>
<script>
(function(){'use strict';const L=window.BEHISTORICAL_LESSON||{},T=window.BEHISTORICAL_TEACHING,$=s=>document.querySelector(s);if(!T)return;const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function vurl(v){if(!v)return'';if(v.type==='map')return(L.map&&L.map.url)||'';if(v.type==='evidence'&&L.images&&L.images[v.index])return L.images[v.index].url||'';if(v.type==='stable'&&L.stableImages)return L.stableImages[v.key]||'';return v.url||'';}function alt(v){if(!v)return'';if(v.type==='map')return L.map&&L.map.title||'Silk Roads map';if(v.type==='evidence'&&L.images&&L.images[v.index])return L.images[v.index].title||'';return v.alt||'';}function render(s){const e='<div class="slide-eyebrow">'+esc(s.eyebrow||'')+'</div>',sub=s.subtitle?'<div class="subtitle">'+esc(s.subtitle)+'</div>':'',foot=s.footer?'<div class="footer">'+esc(s.footer)+'</div>':'';if(s.kind==='hero'){const u=vurl(s.visual);return'<div class="slide hero-slide '+(u?'has-image':'')+'">'+(u?'<img class="slide-visual" src="'+esc(u)+'" alt="'+esc(alt(s.visual))+'">':'')+'<div class="hero-copy">'+e+'<h2>'+esc(s.title)+'</h2>'+sub+'</div></div>';}if(s.kind==='image'){const u=vurl(s.visual);return'<div class="slide image-slide">'+(u?'<img class="slide-visual" src="'+esc(u)+'" alt="'+esc(alt(s.visual))+'">':'')+'<div class="image-copy">'+e+'<h2>'+esc(s.title)+'</h2>'+foot+'</div></div>';}if(s.kind==='process')return'<div class="slide">'+e+'<h2>'+esc(s.title)+'</h2><div class="steps">'+(s.steps||[]).map(x=>'<div class="step"><b>'+esc(x.label)+'</b><span>'+esc(x.text)+'</span></div>').join('')+'</div>'+foot+'</div>';if(s.kind==='grid')return'<div class="slide">'+e+'<h2>'+esc(s.title)+'</h2><div class="grid">'+(s.cards||[]).map(x=>'<div class="grid-item"><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></div>').join('')+'</div>'+foot+'</div>';if(s.kind==='video'){const y=s.video||{},src='https://www.youtube.com/embed/'+esc(y.youtubeId||'')+'?start='+(y.start||0)+'&end='+(y.end||0)+'&rel=0&modestbranding=1';return'<div class="slide"><div class="video-wrap"><iframe class="video-frame" src="'+src+'" title="'+esc(y.label||s.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><div class="video-copy">'+e+'<h2>'+esc(s.title)+'</h2>'+foot+'</div></div></div>';}return'<div class="slide">'+e+'<h2>'+esc(s.title)+'</h2>'+sub+foot+'</div>';}
let cur=0,key=T.projection.storageKey;try{const d=JSON.parse(localStorage.getItem(key)||'{}');if(Number.isInteger(d.index))cur=Math.max(0,Math.min(T.slides.length-1,d.index));}catch(e){}function show(i){cur=Math.max(0,Math.min(T.slides.length-1,Number(i)||0));$('#stage').innerHTML=render(T.slides[cur]);try{localStorage.setItem(key,JSON.stringify({index:cur,at:Date.now()}));}catch(e){}}window.addEventListener('storage',e=>{if(e.key!==key||!e.newValue)return;try{const d=JSON.parse(e.newValue);if(Number.isInteger(d.index)&&d.index!==cur)show(d.index);}catch(err){}});window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='behistorical-slide')return;show(e.data.index);});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(cur+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(cur-1);}if(e.key==='Home')show(0);if(e.key==='End')show(T.slides.length-1);if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});}});show(cur);})();
</script></body></html>
