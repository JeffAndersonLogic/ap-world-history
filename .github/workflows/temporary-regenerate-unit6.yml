name: Temporary regenerate Unit 6

on:
  push:
    branches:
      - module7-audit-units5-7

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, 'Trigger Unit 6 regeneration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module7-audit-units5-7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate Unit 6 deterministic outputs
        run: node scripts/build-unit6.js
      - name: Commit generated drift fix
        run: |
          if git diff --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unit-6 assets/data beintheroom/unit-6
          git commit -m "Regenerate Unit 6 after Module 07 wiring"
          git push origin HEAD:module7-audit-units5-7
