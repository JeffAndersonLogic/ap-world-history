name: Unit 2 Canvas Final Sync

on:
  push:
    branches: [fix-topic-2-1-content-structure]
    paths:
      - '.github/workflows/unit2-canvas-final-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-topic-2-1-content-structure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align Unit 2 Canvas source to certified topic spines
        run: |
          node <<'NODE'
          const fs = require('fs');

          const overviewPath = 'scripts/build-canvas-events.js';
          let canvas = fs.readFileSync(overviewPath, 'utf8');
          const overviews = {
            '2.1': 'Long-distance Silk Roads trade expanded after 1200 because rising demand for luxury goods made the journey worth financing while caravanserais, credit, banking houses, paper money, and periods of relative political stability reduced merchant risk and cost. Today you follow that economic chain from demand to easier exchange to the growth of trading cities such as Kashgar and Samarkand, then to producers in China, Persia, and India expanding output for distant markets.',
            '2.2': 'The Mongols first built an enormous Eurasian empire, then divided it into khanates, but their expansion still reshaped exchange across the continent. Today you follow how Mongol rule facilitated trade and communication and how intensified contact transferred knowledge and practices across regions, including Greco-Islamic medical knowledge toward western Europe, numbering systems into Europe, and the adoption of the Uyghur script by the Mongols.',
            '2.3': 'Indian Ocean exchange expanded because merchants learned to use predictable monsoon winds and improved maritime technologies such as the compass, astrolabe, and larger ship designs. Today you follow how that expanding system strengthened trading states and cities including the Swahili Coast, Gujarat, and Malacca, created diasporic merchant communities, and connected regions strongly enough for voyages such as Zheng He\'s to operate across an already mature network.',
            '2.4': 'Trans-Saharan trade grew because camel technology and organized caravans made regular long-distance movement across the desert possible. Today you follow how complementary demand for goods such as gold and salt increased the volume and geographic range of exchange and how Mali used its position in that network to facilitate trade, collect wealth, and project power across West Africa.',
            '2.5': 'Expanded exchange networks changed culture as well as commerce. Today you follow three connected consequences: religions, artistic traditions, and technologies such as paper and gunpowder diffused across regions; the fortunes of cities rose or fell with changing patterns of trade and urbanization; and a more connected Afro-Eurasia produced more written travel accounts from observers such as Ibn Battuta, Marco Polo, and Margery Kempe.',
            '2.6': 'The same exchange networks that moved merchants and goods also moved living things. Today you trace two environmental consequences together: crops such as bananas, new rice varieties, and citrus diffused into new regions and affected production and population, while pathogens such as bubonic plague traveled along trade routes and produced enormous demographic and social disruption.',
            '2.7': 'Comparison asks you to explain the networks together rather than retell them one at a time. Today you compare the Silk Roads, Indian Ocean, and trans-Saharan systems through the same categories: environment and transportation, commercial practices and finance, demand and productive capacity, the role of states and cities, and the cultural or environmental effects of exchange. The goal is an AP-style argument built from both meaningful similarities and meaningful differences.'
          };

          for (const [topic, text] of Object.entries(overviews)) {
            const re = new RegExp(`  '${topic.replace('.', '\\.')}'\\s*:\\s*'[^\\n]*'(?=,?\\n)`);
            if (!re.test(canvas)) throw new Error(`Canvas overview ${topic} not found`);
            canvas = canvas.replace(re, `  '${topic}': ${JSON.stringify(text)}`);
          }
          fs.writeFileSync(overviewPath, canvas);

          const schedulePath = 'assets/data/announcements-schedule.js';
          let schedule = fs.readFileSync(schedulePath, 'utf8');
          const strip = s => String(s || '')
            .replace(/<[^>]*>/g, '')
            .replace(/&nbsp;/g, ' ')
            .replace(/&amp;/g, '&')
            .replace(/&rsquo;/g, '’')
            .replace(/&ldquo;|&rdquo;/g, '“')
            .trim();

          for (let n = 1; n <= 7; n++) {
            const topic = `2.${n}`;
            const source = require(`./scripts/lib/deep-reading-content/topic-2-${n}.js`);
            const names = source.empires.slice(0, 4).map(section => `${section.num} ${strip(section.name)}`);
            if (names.length !== 4) throw new Error(`${topic} does not expose four canonical reading sections`);
            const replacement = names.map(name => `          ${JSON.stringify(name)}`).join(',\n');
            const escaped = topic.replace('.', '\\.');
            const re = new RegExp(`(for:\\s*'${escaped}',[\\s\\S]{0,220}?where:\\s*'ebook/unit-2\\.html',[\\s\\S]{0,120}?required:\\s*\\[)[\\s\\S]*?(\\n\\s*\\])`, 'g');
            let hits = 0;
            schedule = schedule.replace(re, (all, start, end) => {
              hits++;
              return `${start}\n${replacement}${end}`;
            });
            if (hits !== 2) throw new Error(`Expected 2 scheduled reading blocks for ${topic}; found ${hits}`);
          }

          schedule = schedule.replace(
            /    \/\/ No module 09:[^\n]*\n(?:    \/\/[^\n]*\n){3}/,
            "    // Module 09 now exists for 2.7, but the Canvas required-work subset intentionally\n    // remains 05, 06, 07, and 10. BeInTheRoom is available as optional enrichment.\n"
          );
          schedule = schedule.replace(
            /    \/\/ NOTE: dates extrapolated[\s\S]*?once that exists\.\n/,
            "    // Unit 2 dates and required-module subsets are the current Canvas schedule.\n"
          );
          fs.writeFileSync(schedulePath, schedule);
          NODE

      - name: Regenerate announcements and Canvas artifacts
        run: |
          node scripts/build-announcements.js
          node scripts/build-canvas-events.js

      - name: Validate offline contracts
        run: node scripts/run-tests.js offline

      - name: Commit final Canvas synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-canvas-events.js assets/data/announcements-schedule.js assets/data/announcements.js docs/canvas/assignments.md docs/canvas/calendar-events.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Synchronize Unit 2 Canvas content with reference standard'
          git push origin HEAD:fix-topic-2-1-content-structure
