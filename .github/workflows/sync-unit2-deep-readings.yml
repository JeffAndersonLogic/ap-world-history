name: Sync Unit 2 Deep Readings

on:
  push:
    branches:
      - fix-topic-2-1-content-structure
    paths:
      - scripts/align-unit2-deep-reading-sources.js
      - scripts/lib/deep-reading-content/topic-2-*.js
      - .github/workflows/sync-unit2-deep-readings.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-topic-2-1-content-structure
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Align canonical Unit 2 Deep Reading sources
        run: node scripts/align-unit2-deep-reading-sources.js

      - name: Rebuild standalone Deep Readings
        run: npm run build:deep-readings

      - name: Rebuild Unit eBooks
        run: npm run build:ebook

      - name: Commit canonical sources and regenerated outputs
        shell: bash
        run: |
          if git diff --quiet -- scripts/lib/deep-reading-content/topic-2-*.js unit-2/deep-reading-topic-2-*.html ebook/unit-2.html; then
            echo "Unit 2 Deep Readings and eBook are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/deep-reading-content/topic-2-*.js unit-2/deep-reading-topic-2-*.html ebook/unit-2.html
          git commit -m "Align Unit 2 Deep Reading sources and eBook"
          git push origin HEAD:fix-topic-2-1-content-structure
