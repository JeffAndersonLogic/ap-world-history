name: Sync Unit 2 Deep Readings

on:
  push:
    branches:
      - fix-topic-2-1-content-structure
    paths:
      - scripts/repair-unit2-deep-readings.js
      - .github/workflows/sync-unit2-deep-readings.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-topic-2-1-content-structure
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair Unit 2 deep readings
        run: node scripts/repair-unit2-deep-readings.js

      - name: Commit repaired deep readings
        shell: bash
        run: |
          if git diff --quiet -- unit-2/deep-reading-topic-2-*.html; then
            echo "Unit 2 deep readings are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unit-2/deep-reading-topic-2-*.html
          git commit -m "Align Unit 2 deep readings to CED spines"
          git push origin HEAD:fix-topic-2-1-content-structure
