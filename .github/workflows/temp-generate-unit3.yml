name: Temporary Unit 3 generation
on:
  push:
    branches:
      - build/topic-3-4-revised
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[generated-unit3]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/topic-3-4-revised
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate derived artifacts
        run: |
          npm run build:readings
          npm run build:deep-readings
          npm run build:ebook
          npm run build:key-concepts
          npm run build:student-os-decks
          node scripts/build-teacher-index.js
          node scripts/build-skills-map.js
          npm run build:socrates
          npm run build:announcements
          npm run build:canvas-events
          node scripts/build-topic-audit-index.js
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refresh Topic 3.3 and 3.4 generated artifacts [generated-unit3]"
            git push origin HEAD:build/topic-3-4-revised
          fi
