name: Nightly

# The checks that cannot sit on the push gate.
#
# check-image-urls.js needs commons.wikimedia.org. Putting a third-party host on
# the push path means their outage becomes your failed build, so it runs here
# instead: a dead Wikimedia file name is real and worth knowing about, but it is
# never a reason to block a commit.
#
# The browser suite runs again here against main specifically, because these are
# the contracts that have broken silently before and a nightly run catches drift
# that arrives from somewhere other than a push.
#
# check-audit-freshness.js is here for a different reason again: it is the check
# that shouts when the weekly topic-audit sweep stops running. It cannot sit on the
# push path because an overdue audit must never be the thing standing between a
# broken classroom page and its fix. It is red until the sweep has run and the
# topics being taught this week have records, which is the point: silence about a
# missing audit is what this whole mechanism exists to end.

on:
  schedule:
    # 07:00 UTC, which is around 02:00 Central. Cron here is always UTC.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Remote image URLs resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Exit 1 means a picture is genuinely gone, and prints the file plus the
      # exact file name to replace, so the run's log is the fix list.
      #
      # Exit 2 means nothing could be checked at all, because the runner could
      # not reach the image hosts. That is the repo's "skipped, not passed"
      # convention, the same one run-tests.js honours for the browser suite, and
      # it must not be red: a job that fails because a third party was
      # unreachable is a job people stop reading, which is exactly how the four
      # genuinely dead images went unnoticed behind a wall of 429s. Rate limits
      # no longer reach here at all; the script reports those as not verified
      # and keeps exit 0. See "Rate limiting is not a broken image" in CLAUDE.md.
      - name: Check every remote Commons URL
        run: |
          set +e
          node scripts/check-image-urls.js
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::notice::Image hosts were unreachable, so nothing was verified. Not a failure."
            exit 0
          fi
          exit $code

  contracts:
    name: Structure and browser contracts on main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Full suite
        run: node scripts/run-tests.js all --strict

  audits:
    name: Topic audits are fresh and the sweep is alive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The staleness signal compares an audit's date against the date content
          # last changed, which is git history. A shallow clone truncates that
          # history, every lookup comes back empty, and the check would report
          # every audited topic as fresh forever, which is the exact false green
          # it exists to refuse.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No npm install: this reads the repo, the schedule and git history, and
      # nothing else. Keeping it dependency-free means it still runs on a bare
      # checkout, the same property the offline suite has.
      - name: Are the audits fresh?
        run: node scripts/check-audit-freshness.js
