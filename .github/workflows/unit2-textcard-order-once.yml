name: Unit 2 text-card order one-shot

on:
  push:
    branches:
      - fix-topic-2-1-content-structure

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-topic-2-1-content-structure
          fetch-depth: 0
      - name: Place text-card renderer after topic config
        run: |
          sed -i 's#<script src="../assets/js/behistorical-evidence-text-card.js?v=20260917-unit2"></script><script src="../assets/data/lesson-2-2-renderer-config.js?v=response-id-fix-v1"></script>#<script src="../assets/data/lesson-2-2-renderer-config.js?v=response-id-fix-v1"></script><script src="../assets/js/behistorical-evidence-text-card.js?v=20260917-unit2"></script>#' unit-2/lesson-2-2-mongol-empire.html
          sed -i 's#<script src="../assets/js/behistorical-evidence-text-card.js?v=20260917-unit2"></script><script src="../assets/data/lesson-2-3-renderer-config.js?v=response-id-fix-v1"></script>#<script src="../assets/data/lesson-2-3-renderer-config.js?v=response-id-fix-v1"></script><script src="../assets/js/behistorical-evidence-text-card.js?v=20260917-unit2"></script>#' unit-2/lesson-2-3-indian-ocean.html
          sed -i 's#<script src="../assets/js/behistorical-evidence-text-card.js?v=20260917-unit2"></script><script src="../assets/data/lesson-2-5-renderer-config.js?v=response-id-fix-v1"></script>#<script src="../assets/data/lesson-2-5-renderer-config.js?v=response-id-fix-v1"></script><script src="../assets/js/behistorical-evidence-text-card.js?v=20260917-unit2"></script>#' unit-2/lesson-2-5-cultural-consequences.html
          node -e "const fs=require('fs'); for(const f of ['unit-2/lesson-2-2-mongol-empire.html','unit-2/lesson-2-3-indian-ocean.html','unit-2/lesson-2-5-cultural-consequences.html']){const s=fs.readFileSync(f,'utf8'); const c=s.indexOf('renderer-config.js'); const t=s.indexOf('behistorical-evidence-text-card.js'); if(c<0||t<c) throw new Error(f+' text-card script is not after renderer config');}"
          node scripts/check-module07-authored.js
      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/unit2-textcard-order-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Unit 2 text evidence render order"
          git push origin HEAD:fix-topic-2-1-content-structure
