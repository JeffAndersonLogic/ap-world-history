name: Unit 2 finish one-shot

on:
  push:
    branches:
      - fix-topic-2-1-content-structure

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-topic-2-1-content-structure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final Unit 2 integration repairs
        run: |
          git fetch origin main --depth=1
          node scripts/finish-unit2-reference.js
      - name: Regenerate canonical derivatives
        run: |
          node scripts/build-unit-readings.js
          npm run build:deep-readings
          npm run build:ebook
          node scripts/build-socrates.js
          node scripts/build-canvas-events.js
          node scripts/build-teaching-os-student-decks.js
          node scripts/generate-status-manifest.js
          if [ -f scripts/build-announcements.js ]; then node scripts/build-announcements.js; fi
      - name: Commit repairs and remove one-shot helpers
        run: |
          rm .github/workflows/unit2-finish-one-shot.yml
          rm scripts/finish-unit2-reference.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish Unit 2 reference-standard integration"
          git push origin HEAD:fix-topic-2-1-content-structure
