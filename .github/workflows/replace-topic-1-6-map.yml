name: Replace Topic 1.6 slide 3 map

on:
  push:
    branches:
      - chatgpt/replace-1-6-slide-3-map
    paths:
      - .github/tmp-map-1-6/TRIGGER

permissions:
  contents: write

jobs:
  replace-map:
    if: github.event.head_commit.message == 'Trigger 1.6 map replacement'
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/replace-1-6-slide-3-map
          fetch-depth: 0

      - name: Reconstruct instructor-supplied map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/maps
          cat .github/tmp-map-1-6/map.part.* | base64 -d > assets/maps/unit1-6-roman-empire-c400.png
          echo 'dde40c7d814d89450136ceea86fcab574891c43b77746eda15fe6483e2e21842  assets/maps/unit1-6-roman-empire-c400.png' | sha256sum -c -

      - name: Patch slide 3 in teacher deck
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'unit-1/deck-topic-1-6-europe.html';
          let html = fs.readFileSync(path, 'utf8');

          const startMarker = '<!-- ═════ 03 THE MAP';
          const endMarker = '<!-- ═════ 04';
          const start = html.indexOf(startMarker);
          const end = html.indexOf(endMarker, start + startMarker.length);
          if (start < 0 || end < 0) throw new Error('Could not isolate slide 3 map section');

          let section = html.slice(start, end);
          function replaceOnce(from, to, label) {
            if (!section.includes(from)) throw new Error(`Expected ${label} was not found`);
            section = section.replace(from, to);
          }

          replaceOnce('data-title="A Fragmented, Faithful Map"', 'data-title="A Divided Empire, a Shared Faith"', 'slide 3 data-title');
          replaceOnce('<h2>A fragmented map, a shared faith</h2>', '<h2>A divided empire, a shared faith</h2>', 'slide 3 heading');

          const note = 'data-notes="This is a reference map of the Roman Empire at <b>c. 400 CE</b>, roughly eight centuries before our Topic 1.6 period. Use it as the before picture. Point out the two administrative halves: the <b>Western Roman Empire</b> in tan and the <b>Eastern Roman Empire</b> in blue, centered on Constantinople. Rome is still on the map, but political unity across the whole Mediterranean world is already divided.<br><br>Then bridge forward: during the fifth century the western imperial government collapsed, while the eastern empire survived as what we call the Byzantine Empire. By 1200, western Europe was not a restored Roman Empire. It was a patchwork of kingdoms, lordships, and Church lands.<br><br>Use the map to make the sequence visible: <b>one Roman world &rarr; divided empire &rarr; western collapse &rarr; medieval political fragmentation</b>. Then set the frame the rest of the deck runs on: <b>political fragmentation, religious unity.</b> The political map fractured, but the Roman Catholic Church crossed those borders."';
          if (!/data-notes="[^"]*"/.test(section)) throw new Error('Expected slide 3 presenter notes were not found');
          section = section.replace(/data-notes="[^"]*"/, note);

          replaceOnce('src="https://www.worldhistory.org/img/r/p/1500x1500/17289.png"', 'src="../assets/maps/unit1-6-roman-empire-c400.png"', 'current slide 3 map source');
          replaceOnce('alt="Map of Europe, North Africa and the Near East around 480 CE, showing the western Roman Empire broken into Visigothic, Vandal, Frankish, Ostrogothic and other successor kingdoms while the Eastern Roman Empire remains intact"', 'alt="Map of the Roman Empire c. 400 CE showing the Eastern Roman Empire in blue and the Western Roman Empire in tan, with major cities including Rome, Milan, Ravenna, Constantinople, Alexandria, Jerusalem, and Carthage"', 'current slide 3 map alt text');
          replaceOnce('<figcaption>The fall of the western Roman Empire, c. 480 CE. Seven centuries before our period, and the fragmentation it shows was never undone. Map: World History Encyclopedia.</figcaption>', '<figcaption>The Roman Empire, c. 400 CE, divided into eastern and western halves. The western imperial government collapsed during the fifth century; the eastern empire endured.</figcaption>', 'current slide 3 caption');

          html = html.slice(0, start) + section + html.slice(end);
          fs.writeFileSync(path, html);
          NODE

      - name: Rebuild student deck
        run: node scripts/build-student-decks.js

      - name: Run offline test suite
        run: npm test

      - name: Remove one-off staging files
        shell: bash
        run: |
          git rm -r .github/tmp-map-1-6
          git rm .github/workflows/replace-topic-1-6-map.yml

      - name: Commit completed deck update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'Replace Topic 1.6 slide 3 map with instructor c. 400 Roman Empire map'
          git push origin HEAD:chatgpt/replace-1-6-slide-3-map
