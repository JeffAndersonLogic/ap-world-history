name: Bootstrap Course-Wide Diagnostic Once
on:
  push:
    branches:
      - course-wide-audit-diagnostic
    paths:
      - '.github/workflows/bootstrap-course-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-wide-audit-diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate course-wide diagnostic
        run: node scripts/audit-course.js
      - name: Commit diagnostic and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-course-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/COURSE-WIDE-DIAGNOSTIC.md docs/course-wide-diagnostic.json .github/workflows/bootstrap-course-audit-once.yml
          git commit -m "Generate course-wide audit diagnostic"
          git push
