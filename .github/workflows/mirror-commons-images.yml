name: Mirror Commons images

# Downloads a repo-local copy of every Wikimedia Commons picture the course links
# to, and commits the copies to the branch it ran on. Run it on a working branch
# after adding a Commons picture, then run `node scripts/mirror-commons-images.js
# --rewrite` and rebuild. The authoring sandbox cannot reach Commons; a runner can.
# See the header of scripts/mirror-commons-images.js for why the course no longer
# hotlinks Commons.

on:
  workflow_dispatch:
  push:
    branches: [claude/hopeful-allen-hkh9sd]
    paths: ['.github/workflows/mirror-commons-images.yml']

permissions:
  contents: write

concurrency:
  group: mirror-commons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download missing copies
        run: node scripts/mirror-commons-images.js --fetch
      - name: Commit them to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git add assets/images/commons
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Repo-local copies of Commons pictures (fetched by a runner)"
          git push
