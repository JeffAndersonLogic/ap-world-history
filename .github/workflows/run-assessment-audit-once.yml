name: Run Assessment Alignment Diagnostic Once
on:
  push:
    branches:
      - course-wide-audit-diagnostic
    paths:
      - '.github/workflows/run-assessment-audit-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course-wide-audit-diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/audit-assessment-alignment.js
      - name: Commit report and remove workflow
        run: |
          rm .github/workflows/run-assessment-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ASSESSMENT-ALIGNMENT-DIAGNOSTIC.md .github/workflows/run-assessment-audit-once.yml
          git commit -m "Generate assessment alignment diagnostic"
          git push
