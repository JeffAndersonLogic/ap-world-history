name: Live check

# Fetches pages from the published GitHub Pages site and fails unless each one
# contains the text given for it. It answers the one question no other check in
# this repo can: is the change actually live, in the bytes a student's browser
# receives, rather than merely committed. A commit on main and a green Pages
# build do not prove that; a cache or a failed deploy can sit between them.
#
# Manual only. Authoring sandboxes usually cannot reach github.io; a runner can.
#
# `checks` is one check per line, written as   path :: text that must appear
# for example
#   unit-2/first-and-10-topic-2-5-cultural-consequences.html :: Goods Were Never the Only
# Each fetch carries a fresh query string so a stale CDN copy is not what gets read.

on:
  workflow_dispatch:
    inputs:
      checks:
        description: 'One per line: path :: text that must appear'
        required: true
      base:
        description: 'Site root'
        required: false
        default: 'https://jeffandersonlogic.github.io/ap-world-history/'

permissions:
  contents: read

jobs:
  live:
    name: Published pages carry the expected text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and compare
        env:
          CHECKS: ${{ inputs.checks }}
          BASE: ${{ inputs.base }}
        run: |
          fail=0; n=0
          while IFS= read -r line; do
            [ -z "${line// }" ] && continue
            path="$(printf '%s' "${line%%::*}" | xargs)"
            want="$(printf '%s' "${line#*::}" | sed 's/^ *//; s/ *$//')"
            n=$((n+1))
            url="${BASE%/}/${path}?live=$(date +%s%N)"
            body="$(curl -sSL --max-time 30 -w '\n%{http_code}' "$url")" || { echo "FAIL  $path  (could not fetch)"; fail=1; continue; }
            code="${body##*$'\n'}"; body="${body%$'\n'*}"
            if [ "$code" != "200" ]; then echo "FAIL  $path  (HTTP $code)"; fail=1
            elif printf '%s' "$body" | grep -qF -- "$want"; then echo "PASS  $path  contains: $want"
            else echo "FAIL  $path  does not contain: $want"; fail=1; fi
          done <<< "$CHECKS"
          [ "$n" -gt 0 ] || { echo "No checks given, which is not a pass."; exit 1; }
          exit $fail
