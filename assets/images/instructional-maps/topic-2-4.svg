  <text class="geo" x="643.5" y="412.2" font-size="34" text-anchor="middle" opacity=".8">SAHARA</text>
  <text class="geo" x="901.5" y="727.6" font-size="22" text-anchor="middle" opacity=".72">SAHEL</text>
  <text class="geo" x="274.8" y="671.5" font-size="20" text-anchor="middle" opacity=".88">MALI EMPIRE</text>
  <text class="small" x="274.8" y="694.2" text-anchor="middle">approximate reach, 14th century</text>
  <text class="geo" x="201.1" y="465.7" font-size="20" transform="rotate(-90 201.1 465.7)" opacity=".65">ATLANTIC OCEAN</text>
  <text class="geo" x="725.4" y="169.1" font-size="19" text-anchor="middle" opacity=".62">MEDITERRANEAN WORLD</text>
  <text class="small" x="922.0" y="754.3" transform="rotate(-28 922.0 754.3)">Niger River</text>
  <g filter="url(#shadow)"><rect x="306.2" y="767.0" width="120" height="42" rx="9" fill="#FFF8E7" stroke="#A87316" stroke-width="2"/><circle cx="322.2" cy="788.0" r="9" fill="#C89B37"/><text class="place" x="340.2" y="794.0">Bambuk</text></g>
  <g filter="url(#shadow)"><rect x="392.3" y="784.5" width="105" height="42" rx="9" fill="#FFF8E7" stroke="#A87316" stroke-width="2"/><circle cx="408.3" cy="805.5" r="9" fill="#C89B37"/><text class="place" x="426.3" y="811.5">Bure</text></g>
  <text class="small" x="287.1" y="863.9">major gold-producing regions</text>
  <g><line x1="632.4" y1="271.1" x2="610.4" y2="237.1" stroke="#726756" stroke-width="1.5" opacity=".78"/><circle class="city" cx="632.4" cy="271.1" r="8"/><rect x="472.4" y="219.1" width="138" height="36" rx="8" fill="#FFFDF7" fill-opacity=".95" stroke="#C8B99E" stroke-width="1.3"/><text class="place" x="484.4" y="243.1">Sijilmasa</text></g>
  <g><line x1="578.7" y1="487.9" x2="554.7" y2="495.9" stroke="#726756" stroke-width="1.5" opacity=".78"/><circle class="city" cx="578.7" cy="487.9" r="8"/><rect x="424.7" y="477.9" width="130" height="36" rx="8" fill="#FFFDF7" fill-opacity=".95" stroke="#C8B99E" stroke-width="1.3"/><text class="place" x="436.7" y="501.9">Taghaza</text></g>
  <g><line x1="519.3" y1="644.7" x2="489.3" y2="686.7" stroke="#726756" stroke-width="1.5" opacity=".78"/><circle class="city" cx="519.3" cy="644.7" r="8"/><rect x="373.3" y="668.7" width="116" height="36" rx="8" fill="#FFFDF7" fill-opacity=".95" stroke="#C8B99E" stroke-width="1.3"/><text class="place" x="385.3" y="692.7">Walata</text></g>
  <g><line x1="684.0" y1="658.9" x2="702.0" y2="622.9" stroke="#726756" stroke-width="1.5" opacity=".78"/><circle class="city" cx="684.0" cy="658.9" r="8"/><rect x="702.0" y="604.9" width="138" height="36" rx="8" fill="#FFFDF7" fill-opacity=".95" stroke="#C8B99E" stroke-width="1.3"/><text class="place" x="714.0" y="628.9">Timbuktu</text></g>
