<g filter="url(#shadow)"><rect x="1192" y="140" width="368" height="800" rx="18" fill="#FFFDF7" stroke="#A99B7F" stroke-width="2"/></g>
<text class="panelh" x="1222" y="188">How to read this map</text>
<line x1="1222" y1="205" x2="1530" y2="205" stroke="#C9A46A" stroke-width="3"/>
<circle cx="1241" cy="248" r="18" fill="#8C5A2B"/><text x="1241" y="255" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#FFFDF7">1</text>
<text class="panel" x="1272" y="244" font-weight="700">The Sahara is the obstacle.</text>
<text class="panel" x="1272" y="270"><tspan x="1272" dy="0">Caravans crossed it by moving</tspan><tspan x="1272" dy="23">between known oases and</tspan><tspan x="1272" dy="23">desert supply points.</tspan></text>
<circle cx="1241" cy="365" r="18" fill="#8C5A2B"/><text x="1241" y="372" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#FFFDF7">2</text>
<text class="panel" x="1272" y="361" font-weight="700">Gold and salt move opposite ways.</text>
<text class="panel" x="1272" y="387"><tspan x="1272" dy="0">Gold from West African fields</tspan><tspan x="1272" dy="23">moved north; Saharan salt</tspan><tspan x="1272" dy="23">moved south toward the Sahel.</tspan></text>
<circle cx="1241" cy="482" r="18" fill="#8C5A2B"/><text x="1241" y="489" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#FFFDF7">3</text>
<text class="panel" x="1272" y="478" font-weight="700">Mali sits where routes meet wealth.</text>
<text class="panel" x="1272" y="504"><tspan x="1272" dy="0">Mali benefited by protecting and</tspan><tspan x="1272" dy="23">taxing exchange linking the Niger</tspan><tspan x="1272" dy="23">to North Africa.</tspan></text>
<text class="panelh" x="1222" y="598">What moves where</text>
<rect x="1222" y="616" width="145" height="40" rx="8" fill="#FFF8E7" stroke="#A87316" stroke-width="2"/><text class="panel" x="1294" y="642" text-anchor="middle" font-weight="700">GOLD → north</text>
<rect x="1380" y="616" width="150" height="40" rx="8" fill="#F3F4F2" stroke="#5F6C70" stroke-width="2"/><text class="panel" x="1455" y="642" text-anchor="middle" font-weight="700">SALT → south</text>
<text class="panelh" x="1222" y="700">Map key</text>
<rect x="1222" y="718" width="36" height="22" rx="4" fill="#C9A46A" fill-opacity=".42" stroke="#6B3E1F" stroke-width="2" stroke-dasharray="7 5"/><text class="panel" x="1274" y="736">Mali, c. 14th century (approx.)</text>
<line x1="1224" y1="773" x2="1258" y2="773" stroke="#8C5A2B" stroke-width="5" stroke-dasharray="10 8"/><text class="panel" x="1274" y="779">Major caravan corridor</text>
<line x1="1224" y1="812" x2="1258" y2="812" stroke="#4E6B72" stroke-width="7"/><text class="panel" x="1274" y="818">Niger River</text>
<circle cx="1241" cy="853" r="8" class="city"/><text class="panel" x="1274" y="859">Trade city / caravan node</text>
<circle cx="1241" cy="894" r="10" fill="#C89B37"/><text class="panel" x="1274" y="900">Gold-producing region</text>
<rect x="38" y="956" width="1522" height="28" rx="8" fill="#F4EBDD"/>
<text class="tiny" x="54" y="975">BeHistorical instructional reference. Historical routes and imperial reach are simplified to show the c. 1200–1450 trade system clearly; modern political borders are intentionally omitted.</text>
</svg>