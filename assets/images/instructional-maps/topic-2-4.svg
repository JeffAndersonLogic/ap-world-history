<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">Trans-Saharan Trade: Mali, Gold, Salt, and Caravan Routes</title>
<desc id="map-desc">Focused instructional reference map of North Africa, the Sahara, and the western Sahel c. 1200 to 1450. Major caravan corridors link North African markets through Sijilmasa, Taghaza, Walata, Timbuktu, Tuat, and Gao. The map also shows Djenne, the Niger River, West African gold-producing regions, Saharan salt, and the approximate reach of the Mali Empire in the fourteenth century.</desc>
<defs>
  <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#F1E7D5"/></linearGradient>
  <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DDE8E7"/><stop offset="1" stop-color="#C9D8D7"/></linearGradient>
  <pattern id="sand" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="5" cy="7" r="1.2" fill="#B98B54" opacity=".18"/><circle cx="20" cy="18" r="1" fill="#B98B54" opacity=".13"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A1C1D" flood-opacity=".16"/></filter>
  <style>
    .title{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:42px;fill:#1A1C1D}
    .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#3E4447;letter-spacing:1px}
    .geo{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:2px;fill:#5B5144}
    .place{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:17px;fill:#1A1C1D}
    .panelh{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:25px;fill:#1A1C1D}
    .panel{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1A1C1D}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#3E4447}
    .tiny{font-family:Arial,Helvetica,sans-serif;font-size:12.5px;fill:#4C5457}
    .route{fill:none;stroke:#8C5A2B;stroke-width:5;stroke-dasharray:14 11;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
    .river{fill:none;stroke:#4E6B72;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
    .city{fill:#1A1C1D;stroke:#FFFDF7;stroke-width:3}
  </style>
</defs>
