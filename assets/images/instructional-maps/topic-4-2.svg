  <text class="tiny" x="46" y="980">BeHistorical instructional map. Routes are schematic and coastlines simplified. Magellan&apos;s fleet crossed the Pacific to the Philippines, where he was killed in 1521; Elcano brought one ship home in 1522. No northern voyage found a sea route to Asia.</text>
