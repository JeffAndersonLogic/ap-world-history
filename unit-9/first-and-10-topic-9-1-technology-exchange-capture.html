<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First & 10 Capture Wrapper | Topic 9.1</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1A1C1D; overflow: hidden; }
    iframe { width: 100%; height: 100vh; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="first10-frame" src="first-and-10-topic-9-1-technology-exchange.html?v=20260628" title="First and 10 Topic 9.1"></iframe>
  <script>
    const PREFILLED_FIRST10_FORM='https://docs.google.com/forms/d/e/1FAIpQLSe_0wBPNvSivuE0ea3fhty43c4PDNfE-tEWsGsZYyh0gFCxxw/viewform?usp=pp_url&entry.125385659=Unit+9+-+Globalization&entry.187055090=9.1+-+Advances+in+Technology+and+Exchange&entry.1549761827=9.1-first10&entry.2107637366=First+and+10&entry.1963461515=Causation&entry.1963461515=Continuity+and+Change+Over+Time+%28CCOT%29';
    const MAGICSCHOOL_URL='https://student.magicschool.ai/s/login?joinCode=czwb9Q';
    // Overwrite the reading's own submitToGoogleForm. The reading's button uses an
    // inline onclick, and preventDefault on an added listener does NOT stop an inline
    // handler, so adding listeners alongside it opened two tabs: the child's bare form
    // and the wrapper's prefilled one. Overwriting routes the single click through here.
    function wireFirst10Capture() {
      const frame = document.getElementById('first10-frame');
      try {
        const w = frame.contentWindow, d = frame.contentDocument || w.document;
        w.submitToGoogleForm = function () {
          if (typeof w.buildGooglePrompt === 'function') w.buildGooglePrompt();
          const o = d.getElementById('google-output'), t = o ? (o.value || '').trim() : '';
          w.open(PREFILLED_FIRST10_FORM + (t ? '&entry.1845180246=' + encodeURIComponent(t) : ''), '_blank', 'noopener');
        };
        d.addEventListener('click', function (event) {
          const target = event.target && event.target.closest ? event.target.closest('a,button') : null;
          if (!target) return;
          const label = (target.textContent || '').trim().toLowerCase();
          if (label === 'open magicschool' || label === 'open ai coach') {
            event.preventDefault();
            w.open(MAGICSCHOOL_URL, '_blank', 'noopener');
          }
        }, true);
      } catch (error) { console.warn('Unable to wire First & 10 capture:', error); }
    }
    document.getElementById('first10-frame').addEventListener('load', wireFirst10Capture);
  </script>
</body>
</html>
